name: Publish Teresina to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'teresina/**'
      - 'scripts/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and build dashboard
        run: |
          set -euo pipefail
          node --check teresina/app.js
          node --check teresina/inventory.js
          node --check teresina/ui.js
          node teresina/test-core.cjs
          bash scripts/build-cloudflare-pages.sh
          node scripts/check-static.cjs
      - name: Identify configured secret names
        env:
          CONFIGURED_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          names = sorted(name for name in json.loads(os.environ['CONFIGURED_SECRETS']) if name != 'GITHUB_TOKEN')
          print('::notice title=Available secret names::' + (', '.join(names) or 'No custom secrets are available to this job.'))
          PYTHON
      - name: Check Cloudflare secret bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN (or CF_API_TOKEN).'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID).'
            exit 1
          fi
      - name: Publish production dashboard
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pcm-aegea-teresina --branch=main
      - name: Verify deployed files
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: python3 scripts/verify-cloudflare.py
